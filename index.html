<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Orchard — online store of the latest Apple devices: iPhone, iPad, Mac, Apple Watch and AirPods."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Orchard — Apple devices store</title>
    <script>
      if (!location.hash || location.hash === "#/") {
        const banner = document.createElement("link");

        banner.rel = "preload";
        banner.as = "image";
        banner.href = "%BASE_URL%img/products/iphone-18-pro/burgundy-0.webp";
        banner.fetchPriority = "high";
        document.head.append(banner);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
